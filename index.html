<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>华诞 · 头像工坊</title><meta name="description" content="挑选国庆模板，上传照片，制作并保存你的专属微信头像。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23aa1829'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='25' fill='%23ffd780'%3E华%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#252329;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;font-size:16px}button,input{font:inherit}button{cursor:pointer}header{height:86px;padding:0 5%;background:white;border-bottom:1px solid #e8e6e8;display:flex;align-items:center;justify-content:space-between}.brand{font-family:serif;font-size:25px;letter-spacing:2px;font-weight:bold}.brand span{background:#a6192c;color:#ffe0a6;border-radius:9px;padding:8px;margin-right:12px}.privacy{font-size:14px;color:#68646c}main{max-width:1200px;margin:36px auto;padding:0 26px}h1{font-family:serif;font-size:32px;margin:0 0 8px}p{color:#77717b;margin:0;line-height:1.7}.intro{margin-bottom:26px}.workspace{display:grid;grid-template-columns:300px 1fr;gap:24px}.panel{background:white;border:1px solid #e7e4e7;border-radius:18px;padding:24px}.step{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 20px}.number{color:#a6192c;background:#faeef0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}.templates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.template{background:white;border:2px solid #eee;border-radius:12px;padding:6px;text-align:left;color:#48414b}.template[aria-pressed=true]{border-color:#a6192c;background:#fff4f5}.template img{display:block;width:100%;aspect-ratio:1;background:#e5e2e6;border-radius:6px}.template span{display:block;font-size:14px;margin:8px 2px 4px}.divider{height:1px;background:#eeecee;margin:26px 0}.upload{display:block;width:100%;padding:22px 10px;border:1px dashed #cdb9bd;border-radius:10px;background:#fffafb;text-align:center;color:#a6192c;font-weight:600;cursor:pointer}.upload small{display:block;font-size:12px;font-weight:400;color:#8d7c81;margin-top:6px}.upload:focus-within{outline:2px solid #a6192c}.file{position:absolute;width:1px;height:1px;opacity:0}.filename{font-size:13px;word-break:break-all;margin-top:10px}.controls{margin-top:22px}.controls label{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 6px}input[type=range]{width:100%;accent-color:#a6192c}.reset{border:0;background:transparent;color:#9b2535;padding:10px 0;font-size:14px}.editor{padding:24px;display:flex;flex-direction:column;align-items:center}.editor-head{display:flex;width:100%;justify-content:space-between;align-items:center;margin-bottom:20px}.editor-head h2{font-size:17px;margin:0}.tag{font-size:12px;letter-spacing:1px;color:#86717a;border:1px solid #e9e1e4;border-radius:30px;padding:5px 10px}.canvas-wrap{width:min(100%,520px);aspect-ratio:1;position:relative;border-radius:12px;overflow:hidden;box-shadow:0 12px 32px #36233114;background-color:#f2f0f2;background-image:conic-gradient(#e1dee3 25%,transparent 0 50%,#e1dee3 0 75%,transparent 0);background-size:24px 24px}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.empty{position:absolute;left:39%;top:38%;width:44%;text-align:center;pointer-events:none;color:#64545b}.empty strong{font-size:20px;display:block;margin-bottom:8px}.empty span{font-size:14px}.hint{font-size:13px;margin:16px 0}.download{border:0;background:#a6192c;color:#fff;padding:15px 26px;border-radius:10px;font-weight:600;width:min(100%,520px);box-shadow:0 5px 15px #a6192c20}.download:disabled{background:#c9b2b6;cursor:not-allowed;box-shadow:none}.status{min-height:24px;font-size:14px;text-align:center;color:#9b2535;margin-top:10px}footer{padding:26px;text-align:center;color:#908891;font-size:13px}@media(max-width:760px){header{height:72px}.privacy{display:none}main{margin:24px auto;padding:0 16px}h1{font-size:27px}.workspace{grid-template-columns:1fr;gap:16px}.panel{padding:18px}.templates{max-width:310px}.editor{grid-row:1}.canvas-wrap{max-width:450px}.intro p{font-size:14px}.controls{margin-top:15px}}
.templates{max-height:420px;overflow-y:auto;padding:2px 5px 2px 2px;overscroll-behavior:contain}.template img{background-color:#e5e2e6;background-image:conic-gradient(#ccc8cf 25%,transparent 0 50%,#ccc8cf 0 75%,transparent 0);background-size:16px 16px}@media(max-width:760px){.templates{max-width:none;max-height:300px;grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header><div class="brand"><span>华</span>头像工坊</div><div class="privacy">照片仅在你的设备上处理</div></header><main><div class="intro"><h1>给头像，添一份中国红。</h1><p>选一个喜欢的边框，留下你的国庆专属头像。</p></div><div class="workspace"><aside class="panel"><h2 class="step"><span class="number">1</span>选择模板 · 22 款</h2><div class="templates"><button class="template" data-template="0" aria-pressed="true"><img src="frame-1.png" loading="lazy" alt="盛世华诞 · 宽窗模板"><span>盛世华诞 · 宽窗</span></button><button class="template" data-template="1" aria-pressed="false"><img src="frame-2.png" loading="lazy" alt="盛世华诞 · 锦绣模板"><span>盛世华诞 · 锦绣</span></button><button class="template" data-template="2" aria-pressed="false"><img src="01-guoqingkuaile-refactor.png" loading="lazy" alt="国庆快乐模板"><span>国庆快乐</span></button><button class="template" data-template="3" aria-pressed="false"><img src="02-huandunguoqing-refactor.png" loading="lazy" alt="欢度国庆模板"><span>欢度国庆</span></button><button class="template" data-template="4" aria-pressed="false"><img src="03-xiyingguoqing-refactor.png" loading="lazy" alt="喜迎国庆模板"><span>喜迎国庆</span></button><button class="template" data-template="5" aria-pressed="false"><img src="04-zuguoshengrikuaile-refactor.png" loading="lazy" alt="祖国生日快乐模板"><span>祖国生日快乐</span></button><button class="template" data-template="6" aria-pressed="false"><img src="05-shengshihuadan-refactor.png" loading="lazy" alt="盛世华诞模板"><span>盛世华诞</span></button><button class="template" data-template="7" aria-pressed="false"><img src="06-woainizhongguo-refactor.png" loading="lazy" alt="我爱你中国模板"><span>我爱你中国</span></button><button class="template" data-template="8" aria-pressed="false"><img src="07-woaizuguo-refactor.png" loading="lazy" alt="我爱祖国模板"><span>我爱祖国</span></button><button class="template" data-template="9" aria-pressed="false"><img src="08-wodezhongguoxin-refactor.png" loading="lazy" alt="我的中国心模板"><span>我的中国心</span></button><button class="template" data-template="10" aria-pressed="false"><img src="09-wohewodezuguo-refactor.png" loading="lazy" alt="我和我的祖国模板"><span>我和我的祖国</span></button><button class="template" data-template="11" aria-pressed="false"><img src="10-xinnianzhongguohong-refactor.png" loading="lazy" alt="信念中国红模板"><span>信念中国红</span></button><button class="template" data-template="12" aria-pressed="false"><img src="11-shengshizhonghua-refactor.png" loading="lazy" alt="盛世中华模板"><span>盛世中华</span></button><button class="template" data-template="13" aria-pressed="false"><img src="12-zuguowansui-refactor.png" loading="lazy" alt="祖国万岁模板"><span>祖国万岁</span></button><button class="template" data-template="14" aria-pressed="false"><img src="13-jingxiuzhonghua-refactor.png" loading="lazy" alt="锦绣中华模板"><span>锦绣中华</span></button><button class="template" data-template="15" aria-pressed="false"><img src="14-hongqipiaoyang-refactor.png" loading="lazy" alt="红旗飘扬模板"><span>红旗飘扬</span></button><button class="template" data-template="16" aria-pressed="false"><img src="15-zhongguohong-refactor.png" loading="lazy" alt="中国红模板"><span>中国红</span></button><button class="template" data-template="17" aria-pressed="false"><img src="16-wuxinghongqi-refactor.png" loading="lazy" alt="五星红旗模板"><span>五星红旗</span></button><button class="template" data-template="18" aria-pressed="false"><img src="17-hongxinshanyao-refactor.png" loading="lazy" alt="红星闪耀模板"><span>红星闪耀</span></button><button class="template" data-template="19" aria-pressed="false"><img src="18-hongxinyingzhongguo-refactor.png" loading="lazy" alt="红星映中国模板"><span>红星映中国</span></button><button class="template" data-template="20" aria-pressed="false"><img src="19-wuxingyaozhonghua-refactor.png" loading="lazy" alt="五星耀中华模板"><span>五星耀中华</span></button><button class="template" data-template="21" aria-pressed="false"><img src="20-hongqiyinghuaxia-refactor.png" loading="lazy" alt="红旗映华夏模板"><span>红旗映华夏</span></button></div><div class="divider"></div><h2 class="step"><span class="number">2</span>添加你的照片</h2><label class="upload">＋ 选择照片<input class="file" id="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>支持 JPG、PNG、WebP · 最大 20 MB</small></label><p class="filename" id="filename"></p><div class="controls"><label for="zoom">照片缩放 <output id="zoomValue">100%</output></label><input id="zoom" type="range" min="0.1" max="3" step="0.01" value="1" disabled><label for="x">左右位置</label><input id="x" type="range" min="-1024" max="1024" step="1" value="0" disabled><label for="y">上下位置</label><input id="y" type="range" min="-1024" max="1024" step="1" value="0" disabled><button class="reset" id="reset" disabled>重置照片位置</button></div></aside><section class="panel editor"><div class="editor-head"><h2>头像预览</h2><span class="tag">1024 × 1024 · PNG</span></div><div class="canvas-wrap"><canvas id="canvas" width="1024" height="1024" aria-label="头像合成预览，可拖动照片调整位置"></canvas><div class="empty" id="empty"><strong>这里，留给你</strong><span>选择照片，即刻预览</span></div></div><p class="hint">拖动照片或使用滑块调整位置；移出照片边缘时会露出白底</p><button class="download" id="save" disabled>下载我的头像</button><p class="status" id="status" role="status" aria-live="polite">正在加载模板…</p></section></div></main><footer>照片无需上传服务器，合成后直接保存到本地。</footer><script src="app.js"></script></body></html>
